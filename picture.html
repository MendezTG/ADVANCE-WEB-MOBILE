<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture Browser</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
	<a class="right" href="labs.html">RETURN TO LAB WORK</a> 
    <h1 class="hp">Picture Browser</h1>
    <p class="pp">Browse Through My Favorite Photos</p>
    <div class="box2">
        <div class="box2-1">
            Image <span id="current-index">1</span> of <span id="total-images">5</span>
        </div>
        
        <div class="caption" id="image-caption">
            Loading image...
        </div>
        
        <div class="image">
            <img id="current-image" src="">
        </div>
        
        <div class="keys">
            <p>← Left arrow: Previous image</p>
            <p>→ Right arrow: Next image</p>
        </div>
    </div>

<script>
    $(document).ready(function() {
        const images = [
                {
                    url: "dog.png",
                    caption: "A really cool Detective Dog",
                },
                {
                    url: "me.jpeg",
                    caption: "A funny picture of me",
                },
                {
                    url: "me_pt2.jpeg",
                    caption: "A picture of Donkey Kong that reminds me of myself when I listen to music.",
                },
                {
                    url: "me_pt3.jpeg",
                    caption: "A picture of a Ness cosplayer. Ness is character from the game EarthBound, I really like Ness.",
                },
                {
                    url: "time.jpeg",
                    caption: "Your time will come...",
                }
        ];
        let currentIndex = 0;
        const $image = $('#current-image');
        const $caption = $('#image-caption');
        const $currentIndex = $('#current-index');
        const $totalImages = $('#total-images');
            
        $totalImages.text(images.length);
        loadImage(currentIndex);
            
        function loadImage(index) {
            $image.addClass('fade-out');
            const img = new Image();
                img.onload = function() {
                setTimeout(function() {
                    $image.attr('src', images[index].url);
                    $caption.text(images[index].caption);
                    $currentIndex.text(index + 1);
                    $image.removeClass('fade-out');
                }, 300);
            };
                

            img.src = images[index].url;
            }
            
        function showNext() {
            currentIndex = (currentIndex + 1) % images.length;
            loadImage(currentIndex);
        }
            
        function showPrev() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            loadImage(currentIndex);
        }
        $(document).keydown(function(e) {
            if (e.key === ' ') {
                e.preventDefault();
            }
                
            switch(e.key) {
                case 'ArrowRight':
                case ' ':
                    showNext();
                    break;
                case 'ArrowLeft':
                    showPrev();
                    break;
                case 'Home':
                    currentIndex = 0;
                    loadImage(currentIndex);
                    break;
                case 'End':
                    currentIndex = images.length - 1;
                    loadImage(currentIndex);
                    break;
            }
        });
    });
</script>

</body>
</html>
