</head>

<body>

<h1 class="h1C">Calculator</h1>
<div class="input-box">
        <input type="number" id="num1" placeholder="Enter Number"> 
        <input type="number" id="num2" placeholder="Enter Number">
    </div>
    
    <div class="btn">
        <button onclick="calculate('add')">+ Add</button>
        <button onclick="calculate('subtract')">- Subtract</button>
        <button onclick="calculate('multiply')">× Multiply</button>
        <button onclick="calculate('divide')">÷ Divide</button>
    </div>
    
    <div class="input-box">
        <input type="text" id="color" placeholder="Enter color">
    </div>
    
    <div id="result">Result will appear here</div>

<script>
    $(document).ready(function() {
        function calculate(operation) {
            var num1 = parseFloat($("#num1").val());
            var num2 = parseFloat($("#num2").val());
            var color = $("#color").val() ;
            var result; 
            var symbol;

            if(isNaN(num1) || isNaN(num2)){
                $("#result").html("Please Enter a Valid Number")
                return;
            };

            switch(operation) {
                case "add":
                    result = num1 + num2;
                    symbol = "+";
                    break;
                case "subtract":
                    result = num1 - num2;
                    symbol = "-";
                    break;
                case "multiply":
                    result = num1 * num2;
                    symbol = "x";
                    break;
                case "division":
                    if(num1 === 0){
                        $("#result").html("Cannot Divide by Zero");
                        return;
                    }
                    result = num1 / num2;
                    symbol = "÷";
                    break;
            }
            $("#result")
                .html(`${num1} ${symbol} ${num2} = ${result}`)
                .css("color", color);

        };
        $(".btn button").click(function () {
            const operation = $(this).text().toLowerCase();

            if (operation.includes("add")) calculate("add");
            if (operation.includes("subtract")) calculate("subtract");
            if (operation.includes("multiply")) calculate("multiply");
            if (operation.includes("divide")) calculate("divide");
        });
    });
</script>
</body>

</html>
