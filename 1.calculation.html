<!DOCTYPE html>
<html>

<head>
	<title>JavaScript calculation</title>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> 

	<style>
		body {
			background-color: #000000;
			font-family: 'Courier New';
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            color: #31da31;
        }
        
        .input-box {
            margin: 10px;
        }
        
        input {
            padding: 8px;
            margin: 5px;
            width: 100px;
			background-color: #000;
			border: 2px solid #31da31;
			color: white
        }
        
        button {
            padding: 10px 15px;
            margin: 5px;
            background-color: #31da31;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        #result {
            font-size: 24px;
            font-weight: bold;
            margin: 20px;
            padding: 10px;
            border: 2px solid #31da31;
            min-height: 40px;
        }
		.right a{
			margin-left: auto;
    		color: #31da31;
    		display: inline-block;
    		border: 2px solid #31da31;
    		padding: 5px;
    		text-align: right;
    		text-decoration: none;
		}
		.right:hover {
			display: inline-block;
    		background-color: #c2c1c4;
    		color: #000000;
    		transform: translate(-2px, -2px);
		}
	</style>
</head>

<body>
<div class="right">
	<a href="project.html">
    RETURN TO LAB WORK & PROJECTS
	</a>
</div>
<h1>Calculator</h1>
<div class="input-box">
        <input type="number" id="num1" placeholder="Enter Number"> 
        <input type="number" id="num2" placeholder="Enter Number">
    </div>
    
    <div>
        <button onclick="calculate('add')">+ Add</button>
        <button onclick="calculate('subtract')">- Subtract</button>
        <button onclick="calculate('multiply')">× Multiply</button>
        <button onclick="calculate('divide')">÷ Divide</button>
    </div>
    
    <div class="input-box">
        <input type="text" id="color" placeholder="Enter color">
    </div>
    
    <div id="result">Result will appear here</div>

<script type="text/javascript">
    function calculate(operation) {
        var num1 = parseFloat($("#num1").val());
        var num2 = parseFloat($("#num2").val());
        var color = $("#color").val() ;
        var result;
        var symbol;
        
        if (operation === 'add') {
            result = num1 + num2;
            symbol = '+';
        } else if (operation === 'subtract') {
            result = num1 - num2;
            symbol = '-';
        } else if (operation === 'multiply') {
            result = num1 * num2;
            symbol = '×';
        } else if (operation === 'divide') {
            if (num2 === 0) {
                result = "Cannot divide by zero";
            } else {
                result = num1 / num2;
            }
            symbol = '÷';
        }
        
        $("#result").html(num1 + " " + symbol + " " + num2 + " = " + result);
        $("#result").css("color", color);
    }
    $(document).ready(function() {
        calculate('add');
    });
</script>
</body>

</html>
