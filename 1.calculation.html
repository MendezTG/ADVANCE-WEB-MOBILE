<body>

<h1 class="h1C">Calculator</h1>
<div class="input-box">
        <input type="number" id="num1" placeholder="Enter Number"> 
        <input type="number" id="num2" placeholder="Enter Number">
    </div>
    
    <div class="btn">
        <button onclick="calculate('add')">+ Add</button>
        <button onclick="calculate('subtract')">- Subtract</button>
        <button onclick="calculate('multiply')">× Multiply</button>
        <button onclick="calculate('divide')">÷ Divide</button>
    </div>
    
    <div class="input-box">
        <input type="text" id="color" placeholder="Enter color">
    </div>
    
    <div id="result">Result will appear here</div>

<script type="text/javascript">
    function calculate(operation) {
        var num1 = parseFloat($("#num1").val());
        var num2 = parseFloat($("#num2").val());
        var color = $("#color").val() ;
        var result;
        var symbol;
        
        if (operation === 'add') {
            result = num1 + num2;
            symbol = '+';
        } else if (operation === 'subtract') {
            result = num1 - num2;
            symbol = '-';
        } else if (operation === 'multiply') {
            result = num1 * num2;
            symbol = '×';
        } else if (operation === 'divide') {
            if (num2 === 0) {
                result = "Cannot divide by zero";
            } else {
                result = num1 / num2;
            }
            symbol = '÷';
        }
        
        $("#result").html(num1 + " " + symbol + " " + num2 + " = " + result);
        $("#result").css("color", color);
    }
    $(document).ready(function() {
        calculate('add');
    });
</script>
</body>
